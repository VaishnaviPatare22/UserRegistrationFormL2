<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { min-height: 100vh; display: grid; place-items: center; margin: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .container { width: 100%; max-width: 360px; background: #ffffff; padding: 28px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        h2 { margin: 0 0 18px; text-align: center; color: #2d3748; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 600; color: #4a5568; }
        input { width: 100%; padding: 10px; border: 1.5px solid #e2e8f0; border-radius: 6px; outline: none; transition: 0.2s; }
        input:focus { border-color: #667eea; }
        .error-message { color: #e53e3e; font-size: 11px; margin-top: 3px; display: none; }
        button { width: 100%; padding: 11px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="container">
    <h2>User Registration</h2>
    <form id="registrationForm" novalidate>
        <div class="form-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" placeholder="Enter your full name" required>
            <span class="error-message" id="nameError">Please enter your name.</span>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>
            <span class="error-message" id="emailError">Please enter a valid email address.</span>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password (min 6 chars)" required>
            <span class="error-message" id="passwordError">Password must be at least 6 characters.</span>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" placeholder="Confirm password" required>
            <span class="error-message" id="confirmError">Passwords do not match.</span>
        </div>
        <button type="submit">Register</button>
    </form>
</div>

<script>
    const form = document.getElementById('registrationForm');
    const fields = [
        { el: document.getElementById('fullname'), err: document.getElementById('nameError'), val: v => v.trim() !== '' },
        { el: document.getElementById('email'), err: document.getElementById('emailError'), val: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) },
        { el: document.getElementById('password'), err: document.getElementById('passwordError'), val: v => v.length >= 6 },
        { el: document.getElementById('confirm_password'), err: document.getElementById('confirmError'), val: v => v && v === document.getElementById('password').value }
    ];

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        let valid = true;
        fields.forEach(f => {
            const ok = f.val(f.el.value);
            f.err.style.display = ok ? 'none' : 'block';
            f.el.style.borderColor = ok ? '#e2e8f0' : '#e53e3e';
            if (!ok) valid = false;
        });

        if (valid) {
            alert('Registration Successful!');
            form.reset();
        }
    });
</script>

</body>
</html>
